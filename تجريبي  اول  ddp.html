function showView(id){$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'});}

function fmt(v){return Number.isInteger(v)?v.toFixed(0):v.toFixed(2)}
function getStatus(id){try{return localStorage.getItem('plan-status-'+id)||'لم يتم التحديث'}catch(e){return 'لم يتم التحديث'}}
function setStatus(id,val){try{localStorage.setItem('plan-status-'+id,val)}catch(e){};toast('تم حفظ حالة المتابعة محليًا لهذه الجلسة.')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
